# Pinning actions to commit SHAs (see workflows/nextjs.yml) stops a moved tag
# from silently changing what runs — but it also freezes security fixes, so this
# is the other half of that trade: Dependabot proposes the SHA bumps, with the
# tag it corresponds to in the PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Site dependencies. Grouped so routine patches arrive as one PR rather than
  # a dozen; majors stay separate because they need the staged verification.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The Ask-AI worker has its own lockfile and is not covered by the root entry.
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
